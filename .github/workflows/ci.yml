name: Passenger CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passenger-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Passenger app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Firebase boundary
        run: npm run check:firebase-boundary

      - name: Check app identity
        run: npm run check:app-identity

      - name: Check deferred payment domain
        run: npm run check:no-money
